# MOVER ESTE ARQUIVO PARA: .github/workflows/ci.yml (a pasta .github não pôde ser criada remotamente)
# Roda a cada push e pull request: nada chega na main sem testes verdes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # O runner do GitHub já tem Docker: os testes de integração sobem o Postgres via Testcontainers
      - name: Testes (unidade + integração + arquitetura)
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Documentação dos módulos (Spring Modulith)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore

# Publica o frontend em MODO DEMONSTRAÇÃO (sem backend) no GitHub Pages para a equipe e a ONG navegarem.
# Ativar em: GitHub → Settings → Pages → Source: "GitHub Actions".
# Atenção: em organização no plano gratuito, o Pages só funciona com repositório público.
name: Prévia do frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Compilar (modo mock, caminho do repositório)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_USAR_API: "false"
      # O Pages não conhece as rotas do React: o 404.html devolve o próprio app (links diretos funcionam)
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
